<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XiansAi SDK · Chat Example</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__dot"></span>
          <span class="brand__title">XiansAi Chat</span>
        </div>
        <div class="status" id="status">
          <span class="status__dot" id="statusDot"></span>
          <span id="statusText">Disconnected</span>
        </div>
      </header>

      <!-- Connection settings -->
      <section class="config" id="config">
        <form class="config__form" id="configForm">
          <div class="field field--full">
            <label>Server (proxied via Vite dev server)</label>
            <div class="proxy-note">
              Requests go to <code>this origin</code> → proxied to
              <code id="proxyTarget">http://localhost:5005</code>
              <span class="proxy-note__hint">set <code>VITE_SERVER_URL</code> in <code>.env</code></span>
            </div>
          </div>
          <div class="field">
            <label for="tenantId">Tenant ID</label>
            <input id="tenantId" name="tenantId" placeholder="my-tenant" required />
          </div>
          <div class="field">
            <label for="apiKey">API Key</label>
            <input id="apiKey" name="apiKey" type="password" placeholder="sk-..." required />
          </div>
          <div class="field">
            <label for="workflow">Workflow</label>
            <input id="workflow" name="workflow" placeholder="customer-support" required />
          </div>
          <div class="field">
            <label for="participantId">Participant ID</label>
            <input id="participantId" name="participantId" placeholder="user-123" required />
          </div>
          <div class="field field--actions">
            <button type="submit" class="btn btn--primary" id="connectBtn">Connect</button>
            <button type="button" class="btn" id="disconnectBtn" disabled>Disconnect</button>
          </div>
        </form>
      </section>

      <!-- Chat -->
      <main class="chat" id="chat">
        <div class="messages" id="messages">
          <div class="empty" id="emptyState">
            Connect above, then send a message to start chatting with your agent.
          </div>
        </div>
        <form class="composer" id="composer">
          <input
            id="input"
            class="composer__input"
            placeholder="Type a message…"
            autocomplete="off"
            disabled
          />
          <button type="submit" class="btn btn--primary" id="sendBtn" disabled>Send</button>
        </form>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
